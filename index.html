<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Glowna -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyfrowy dzwonek w szkole z www.tikedupl.wixsite.com/aplikacjetik</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #footer {
            position: fixed;
            bottom: 10px;
            text-align: center;
            width: 100%;
        }

        #footer a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body onload="startTime()">

    <div class="container">
        <span id="txt" style="font-size:130px; line-height:100px;"></span>
        <center><p id="txt2" style="font-size:20px; line-height:12px;"></p></center>
        <center><p id="txt3" style="font-size:20px; line-height:12px;"></p></center>
        <center><p id="txt4" style="font-size:20px; line-height:12px;"></p></center>
    </div>

    <div id="footer">
        <p>Cyfrowy dzwonek szkolny na 
            <a href="www.tikedupl.wixsite.com/aplikacjetik" target="_blank">
                www.tikedupl.wixsite.com/aplikacjetik
            </a>
        </p>
    </div>

    <script>
    function startTime() {
        var breaks = ["7.45","8.00","8.45","8.55","9.40","9.50","10.35","10.45","11.30","11.45","12.30","12.35","13.20","13.30","14.15","14.20","15.05"];
        var today = new Date();
        var h = today.getHours();
        var m = today.getMinutes();
        
        document.getElementById('txt').innerHTML = h + ":" + checkTime(m);
        
        var current = new Date(today.getFullYear(), today.getMonth(), today.getDate(), h, m, today.getSeconds());
        var endTime = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 15, 5, 0);
        var startTimeDay = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 7, 45, 0);

        // Domyślny kolor tła (np. ciemny lub niebieski), jeśli nie pasuje do żadnego przedziału
        document.body.style.background = "#2b73ff";

        if (current >= endTime || current < startTimeDay) {
            document.getElementById('txt3').innerHTML = "Poza godzinami lekcyjnymi";
            document.getElementById('txt4').innerHTML = "";
            setTimeout(startTime, 500);
            return;
        }

        for (var i = 0; i < breaks.length - 1; i++) {
            var s = breaks[i].split('.');
            var s2 = breaks[i+1].split('.');
            var dt1 = new Date(today.getFullYear(), today.getMonth(), today.getDate(), parseInt(s[0]), parseInt(s[1]), 0);
            var dt2 = new Date(today.getFullYear(), today.getMonth(), today.getDate(), parseInt(s2[0]), parseInt(s2[1]), 0);

            if (current >= dt1 && current <= dt2) {
                var diffMs = dt2 - current;
                var diffMins = Math.round((diffMs % 3600000) / 60000);
                document.getElementById('txt3').innerHTML = breaks[i] + " - " + breaks[i+1];
                
                if (dt2 - dt1 === 2700000) { // 45 minut lekcji
                    document.body.style.background = "#2b73ff";
                    document.getElementById('txt4').innerHTML = "Do końca lekcji: " + diffMins + " min";
                } else { // przerwa
                    document.body.style.background = "#2cd45a";
                    document.getElementById('txt4').innerHTML = "Do końca przerwy: " + diffMins + " min";
                    if (diffMins <= 1) {
                        document.body.style.background = "#de8c28";
                    }
                }
                break;
            }
        }
        setTimeout(startTime, 500);
    }

    function checkTime(i) {
        return (i < 10 ? "0" + i : i);
    }
</script>

</body>
</html>
